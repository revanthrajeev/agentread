<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" fill="none">
  <!-- AgentRead Logo Mark -->
  <g transform="translate(4, 2)">
    <!-- Outer radar scan ring -->
    <circle cx="20" cy="20" r="18" stroke="#10B981" stroke-width="2.5" stroke-dasharray="88 25" stroke-linecap="round" />
    
    <!-- Mid tracking arc -->
    <circle cx="20" cy="20" r="12" stroke="#10B981" stroke-width="2" stroke-dasharray="55 20" stroke-linecap="round" opacity="0.85" />
    
    <!-- Central checkmark / sweep beacon -->
    <path d="M12 20.5L17.5 26L28.5 13.5" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center pulse node -->
    <circle cx="20" cy="20" r="2.5" fill="#10B981" />
  </g>

  <!-- Wordmark "agentread" -->
  <g transform="translate(56, 30)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.03em" fill="#FFFFFF">
      agent<tspan fill="#10B981" font-weight="500">read</tspan>
    </text>
  </g>
</svg>
